<svg width="560" height="160" viewBox="-40 0 560 160" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2F3F5"/>
      <stop offset="50%" stop-color="#DADDE2"/>
      <stop offset="100%" stop-color="#BFC5CD"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3"
                    flood-color="#000000"
                    flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- INFTEC -->
  <g transform="skewX(-12)">
    <text x="40" y="85"
          font-family="Montserrat, Poppins, Arial, sans-serif"
          font-size="72"
          font-weight="700"
          letter-spacing="3"
          fill="url(#metalGrad)"
          filter="url(#softShadow)">
      INFTEC
    </text>
  </g>

  <!-- TECNOLOGIA -->
  <text x="50" y="130"
        font-family="Montserrat, Poppins, Arial, sans-serif"
        font-size="22"
        font-weight="600"
        letter-spacing="8"
        fill="#C05621">
    TECNOLOGIA
  </text>

</svg>